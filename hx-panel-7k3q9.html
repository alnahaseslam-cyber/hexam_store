<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer">
<title>HEXAM Panel - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#262626;--tx:#f5f5f5;--mut:#8a8a8a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#3b82f6}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx);font-family:'Cairo',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font-family:inherit;font-size:16px;color:var(--tx)}
input,select{background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;outline:none}
.btn{background:#fff;color:#000;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn.ok{background:var(--ok);color:#04210e}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #4a1d1d}.btn.s{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.4}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.lbox h1{font-size:26px;letter-spacing:.2em;text-align:center}.lbox p{color:var(--mut);text-align:center;font-size:13px;margin:4px 0 20px}
.lbox label{display:block;font-size:13px;margin:12px 0 6px;color:var(--mut)}.err{color:var(--bad);font-size:13px;margin-top:12px;text-align:center;min-height:18px}
.wrap{max-width:1320px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 16px;flex-wrap:wrap}
.top h2{font-size:20px;letter-spacing:.15em}.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.me{font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.st small{color:var(--mut);font-size:12px}
.st b{display:block;font-size:24px;margin:4px 0}.st span{font-size:12.5px;color:var(--mut)}.st.p{border-color:#7a5a12}.st.p b{color:var(--warn)}.st.ok b{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;overflow-x:auto}.panel h3{font-size:15px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}th{color:var(--mut);font-weight:600;text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #1d1d1d;vertical-align:middle}tr.row{cursor:pointer}tr.row:hover td{background:#1a1a1a}tr.new td{background:#1d1708}
.bar{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}@media(min-width:760px){.bar{grid-template-columns:2fr 1fr 1fr auto}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}.
